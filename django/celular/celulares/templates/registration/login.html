{% extends "index.html" %}

{% block contenido%}

<style>
    .login-box{ max-width: 300px; margin:50px auto; padding: 20px; border: 1px solid gray;}
    .login-box input {width: 100%; margin-bottom: 10px;}
    .btn-block{width: 100%; background: gray; color: white; cursor: pointer;}
</style>
<div class="login-box">
    <h2>Login</h2>

    {% if form.errors %}
        <p style="color:red;">Datos incorrectos</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p}} <button type="submit" class="btn-block">Entrar</button>

    </form>

    <p><a href="{% url 'registro' %}">Resgistrarse</a></p>
</div>
{% endblock %}
