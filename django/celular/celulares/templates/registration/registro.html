{% extends "index.html" %}

{% block contenido %}
<style>
    .auth-box {max-width: 350px; margin: 40px auto; padding: 20px; border: 1px solid black; border-radius: 8px;}
    .auth-box input {width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box;}
    .btn-block {width: 100%; background: gray; color: white; padding: 10px; border: none; cursor: pointer;}
    .helptext {display: block; font-size: 0.8rem; color: gray;  margin-bottom: 10px; }
    .errorlist { color: red; font-size: 0.8rem; padding:0; list-style: none;}
</style>

<div class="auth-box">
    <h2>Crear Cuenta</h2>
    <hr>

    <form method="post">
        {%csrf_token%}

        <div class="django-form">
            {{ form.as_p}}
        </div>
        <button type="submit" class="btn-block">Registrarse</button>

    </form>

    <p style="text-align: center; margin-top: 15px ;">
        <small>¿Ya tienes cuenta? <a href="{% url 'login'%}">Ingresa Aqui</a></small>
    </p>

</div>
{% endblock %}
