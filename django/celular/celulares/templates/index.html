<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Inventario Celulares {% endblock%}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: azure;
        }

        main{
            flex: 1;
        }

        footer{
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">
                    <span class="text-info">Celu</span>Store
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarVar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarVar">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login'%}">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'registro'%}">Registrarse</a>
                        </li>
                        <li class="nav-item ms-lg-3">
                            <form method="post" action="{%url 'logout'%}" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-info btn-sm">Cerrar Sesion</button>
                            </form>
                        </li>

                    </ul>

                </div>
            </div>
            

        </nav>
        

    </header>

    <main class="container py-5">
        <div class="card shadow-sm border-0 p-4">
            {% block contenido%}
                <div class="text-center py-5">
                    <h2 class=" text-muted">Bienvenido al Sistema</h2>
                    <p>Contenido de paginas</p>
                </div>
            {% endblock%}

        </div>

    </main>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-1">Venta Celulares &copy; 2026</p>
            <small class="text-secondary">Todos los derechos reservados</small>
        </div>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
