{% extends "index.html"%}

{% block contenido %}

    <blockquote class="blockquote">
        <h1 class="display-1">Panel de control</h1>
        <footer class="blockquote-footer">Seleccionar una opcion:</footer>
    </blockquote>

    <ul>
        <li>
            <a type="button" class="btn btn-info" href="{% url 'crear_celulares' %}">Registrar nuevo celular</a>
        </li>
        <li>
            <a href="{% url 'lista_celulares' %}"> Ver Inventario de celulares</a>
        </li>
    </ul>

    <form>
        <div class="form-group">
            <label for="exampleInputEmail1">Email address</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter email">
            <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
        </div>
        <div class="form-group">
            <label for="exampleInputPassword1">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
        </div>
        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">Check me out</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <form>
    <div class="form-group">
        <label for="exampleFormControlFile1">Ingresar documento </label>
        <input type="file" class="form-control-file" id="exampleFormControlFile1">
    </div>
    </form>

<iframe width="560" height="315" src="https://www.youtube.com/embed/4r4IJu7UHtg?si=TdvnQPc95lqbDeZ2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    
{% endblock%}
